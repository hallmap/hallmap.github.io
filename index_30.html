      { name: '버드나무집', addr: '부산 부산진구 동천로108번길 11', region: '경상권', tel: '070-7778-6390', lat: 35.158511, lng: 129.063178 },
      { name: '톤쇼우', addr: '부산 금정구 금강로 247-10', region: '경상권', lat: 35.230406, lng: 129.084267 },

      { name: '정동 광주수완본점', addr: '전남광주 광산구 수완로74번길 11-68', region: '전라권', tel: '0507-1381-3507', lat: 35.193594, lng: 126.8308 },

      { name: 'bd버거 성수역연무장길 점심저녁', addr: '서울 성동구 성수이로14길 7', region: '수도권', tel: '0507-1444-9199', lat: 37.541103, lng: 127.056456 }
    ];

    var region = Object.keys(REGIONS)[0];

    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(REGIONS[region].center[0], REGIONS[region].center[1]),
      zoom: REGIONS[region].zoom,
      zoomControl: true,
      zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
    });
    var infoWindow = new naver.maps.InfoWindow({ content: '' });

    naver.maps.Event.addListener(map, 'click', function () {
      infoWindow.close();
      if (listPin) {
        listPin.setMap(null);
        listPin = null;
      }
    });

    function regionOf(p) {
      return p.region || Object.keys(REGIONS)[0];
    }

    function mains(p) {
      if (!p.main) return [];
      return Array.isArray(p.main) ? p.main : [p.main];
    }

    function catLabel(p) {
      var m = mains(p).join(', ');
      if (!p.cats || !p.cats.length) return m;
      return m + ' · ' + p.cats.map(function (c) { return c.replace('/', ' > '); }).join(', ');
    }

    function fullAddr(p) {
      return [p.addr, p.detail].filter(Boolean).join(' ');
    }

    function openInfo(p) {
      var link = 'https://map.naver.com/p/search/' + encodeURIComponent(regionOf(p) + ' ' + p.name);
      infoWindow.setContent(
        '<div style="padding:10px 12px;font-size:13px;line-height:1.5;max-width:240px;">' +
          '<b>' + p.name + '</b><br>' +
          (catLabel(p) ? '<span style="color:#888">' + catLabel(p) + '</span><br>' : '') +
          (p.note ? p.note + '<br>' : '') +
          (fullAddr(p) ? REGIONS[regionOf(p)].label + fullAddr(p) + '<br>' : '') +
          '<a href="' + link + '" target="_blank">네이버 지도에서 보기</a>' +
        '</div>'
      );
      infoWindow.open(map, p.marker);
    }

    function geocode(p) {
      return new Promise(function (resolve) {
        if (p.lat && p.lng) return resolve();
        naver.maps.Service.geocode({ query: REGIONS[regionOf(p)].prefix + p.addr }, function (status, res) {
          if (status === naver.maps.Service.Status.OK && res.v2.addresses.length) {
            p.lat = parseFloat(res.v2.addresses[0].y);
            p.lng = parseFloat(res.v2.addresses[0].x);
          } else {
            console.warn('주소 검색 실패', status, p.name, REGIONS[regionOf(p)].prefix + p.addr);
          }
          resolve();
        });
      });
    }

    var sel = ['전체', '전체', '전체'];
    var query = '';

    function matchCategory(p) {
      if (regionOf(p) !== region) return false;
      var m = mains(p);
      if (sel[0] !== '전체' && m.indexOf(sel[0]) === -1) return false;
      if (sel[0] === '전체' && !query && m.length &&
          m.every(function (x) { return HIDDEN_MAINS.indexOf(x) !== -1; })) return false;
      if (!p.cats || !p.cats.length) return sel[1] === '전체';
      return p.cats.some(function (c) {
        var parts = c.split('/');
        if (sel[1] !== '전체' && parts[0] !== sel[1]) return false;
        if (sel[2] !== '전체' && parts[1] !== sel[2]) return false;
        return true;
      });
    }

    function matchSearch(p) {
      if (!query) return true;
      var text = (p.name + ' ' + fullAddr(p) + ' ' + mains(p).join(' ') + ' ' + (p.note || '') + ' ' + (p.rec || '') + ' ' + (p.cats || []).join(' ')).toLowerCase();
      return text.indexOf(query) !== -1;
    }

    function buttonRow(id, level, items) {
      var row = document.getElementById(id);
      row.innerHTML = '';
      if (!items) return;
      ['전체'].concat(items).forEach(function (label) {
        var b = document.createElement('button');
        b.className = 'btn l' + level + (sel[level] === label ? ' active' : '');
        b.textContent = label;
        b.onclick = function () {
          sel[level] = label;
          for (var i = level + 1; i < sel.length; i++) sel[i] = '전체';
          render();
        };
        row.appendChild(b);
      });
    }

    var regionsOpen = false;

    function regionRow() {
      var row = document.getElementById('rowRegion');
      row.innerHTML = '';
      var all = Object.keys(REGIONS);
      var visible = regionsOpen ? all : all.filter(function (r, i) { return i === 0 || r === region; });
      visible.forEach(function (r) {
        var b = document.createElement('button');
        b.className = 'btn lr' + (r === region ? ' active' : '');
        b.textContent = r;
        b.onclick = function () {
          if (r === region) return;
          region = r;
          sel = ['전체', '전체', '전체'];
          var c = REGIONS[r].center;
          map.setCenter(new naver.maps.LatLng(c[0], c[1]));
          map.setZoom(REGIONS[r].zoom);
          render();
        };
        row.appendChild(b);
      });
      if (all.length > 1) {
        var t = document.createElement('button');
        t.className = 'btn more';
        t.textContent = regionsOpen ? '◀ 접기' : '다른 지역 ▶';
        t.onclick = function () {
          regionsOpen = !regionsOpen;
          regionRow();
        };
        row.appendChild(t);
      }
    }

    function render() {
      regionRow();
      document.getElementById('noticeLine').textContent =
        NOTICE_HIDDEN_REGIONS.indexOf(region) === -1 ? noticeText : '';
      var cats = CATEGORIES[region] || {};
      buttonRow('row0', 0, Object.keys(cats));
      var mids = sel[0] !== '전체' ? cats[sel[0]] : null;
      buttonRow('row1', 1, mids && Object.keys(mids).length ? Object.keys(mids) : null);
      var subs = mids && sel[1] !== '전체' ? mids[sel[1]] : null;
      buttonRow('row2', 2, subs && subs.length ? subs : null);

      var noteKey = [region].concat(sel.filter(function (x) { return x !== '전체'; })).join('/');
      document.getElementById('filterNote').textContent = FILTER_NOTES[noteKey] || '';

      infoWindow.close();
      var list = document.getElementById('list');
      list.innerHTML = '';
      var shown = [];

      var hidePins = PIN_HIDDEN_REGIONS.indexOf(region) !== -1 && sel[0] === '전체' && !query;
      listPin = null;

      PLACES.forEach(function (p) {
        var ok = matchCategory(p) && matchSearch(p);
        if (p.marker) p.marker.setMap(ok && !hidePins ? map : null);
        if (ok) shown.push(p);
      });

      {
        shown.forEach(function (p) {
          var li = document.createElement('li');
          li.innerHTML = '<div class="name">' + p.name +
            (p.off ? '<span class="off">' + p.off + '</span>' : '') + '</div>' +
            (p.tel ? '<div class="tel">' + p.tel + '</div>' : '') +
            '<div class="meta">' + [catLabel(p), fullAddr(p)].filter(Boolean).join(' · ') +
            (p.marker ? '' : ' <span class="nopos">(위치 못 찾음)</span>') + '</div>' +
            (sel[0] === '⭐추천 식당' && p.rec ? '<div class="rec">추천 메뉴: ' + p.rec + '</div>' : '');
          li.onclick = function () {
            if (!p.marker) return;
            if (hidePins) {
              if (listPin) listPin.setMap(null);
              p.marker.setMap(map);
              listPin = p.marker;
            }
            map.setZoom(17);
            map.panTo(p.marker.getPosition());
            openInfo(p);
            if (window.innerWidth < 600) {
              document.getElementById('panel').classList.add('collapsed');
              document.getElementById('toggle').textContent = '목록 펼치기 ▼';
            }
          };
          list.appendChild(li);
        });
      }

      var msg = hidePins
        ? shown.length + '곳 · 카테고리를 고르면 지도에 핀이 표시돼요'
        : shown.length + '곳 표시 중';
      if (query && shown.length === 0) msg = '검색 결과가 없습니다';
      document.getElementById('count').textContent = msg + failedMsg;
    }

    var failedMsg = '';
    var noticeText = '';
    var NOTICE_HIDDEN_REGIONS = ['춘천'];
    var PIN_HIDDEN_REGIONS = ['춘천'];
    var listPin = null;

    document.getElementById('toggle').addEventListener('click', function () {
      var panel = document.getElementById('panel');
      panel.classList.toggle('collapsed');
      this.textContent = panel.classList.contains('collapsed') ? '목록 펼치기 ▼' : '목록 접기 ▲';
    });
    document.getElementById('search').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      render();
    });

    fetch('notice.txt?t=' + Date.now())
      .then(function (res) { return res.ok ? res.text() : ''; })
      .then(function (text) {
        text = text.trim();
        noticeText = text;
        render();
      })
      .catch(function () {});

    Promise.all(PLACES.map(geocode)).then(function () {
      var failed = [];
      var used = {};
      PLACES.forEach(function (p) {
        if (!p.lat) return;
        var key = p.lat.toFixed(6) + ',' + p.lng.toFixed(6);
        var n = used[key] || 0;
        used[key] = n + 1;
        p.lng += n * 0.00012;
      });
      PLACES.forEach(function (p) {
        if (!p.lat) { failed.push(p.name); return; }
        p.marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(p.lat, p.lng),
          map: map,
          title: p.name
        });
        naver.maps.Event.addListener(p.marker, 'click', function () { openInfo(p); });
      });
      if (failed.length) {
        failedMsg = failed.length === PLACES.length
          ? ' · 위치 못 찾음 (Geocoding 설정 확인)'
          : ' · 위치 못 찾음 ' + failed.length + '곳';
        console.warn('주소로 위치를 못 찾은 가게:', failed);
      }
      render();
    });
  </script>
</body>
</html>
